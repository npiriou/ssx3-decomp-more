name: No game material present

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-game-material:
    name: Assert no game material is present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that no game material or local runtime files are tracked
        run: |
          bad=$(git ls-files | grep -Ei '\.iso$|^orig/|^generated/(ee|ee-unwind|iop|vu)/|^(\.cache|\.refs|saves|textures|dist|target[^/]*)/|SLUS_207\.72|(^|/)(ram|vram)[^/]*\.bin$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Game material and local runtime files must not be committed:"
            echo "$bad"
            exit 1
          fi
